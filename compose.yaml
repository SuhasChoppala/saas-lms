name: ledger

services:
  mongo:
    image: mongo:8.0.32
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Workaround for MongoDB SERVER-121912: Docker Desktop's kernel (7.0.12)
      # is in the affected range 6.19–7.0.13. Remove once `docker info` reports
      # kernel 7.0.14 or newer. Local development only; production is unaffected.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  mongo-data:
