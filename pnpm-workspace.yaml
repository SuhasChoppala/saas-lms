packages:
  - "apps/*"
  - "packages/*"

# Don't run install scripts for this package — it ships a prebuilt binary
allowBuilds:
  unrs-resolver: false

# Supply-chain protection: don't install packages published in the last 24h
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.13"
  - "@turbo/darwin-arm64@2.10.13"
  - "@turbo/linux-64@2.10.13"
  - "@turbo/linux-arm64@2.10.13"
  - "@turbo/windows-64@2.10.13"
  - "@turbo/windows-arm64@2.10.13"
  - turbo@2.10.13
